table{border-collapse:collapse;width:100%}td,th{padding:7px 8px;text-align:left;border-bottom:1px solid rgba(255,140,80,.2)}th{color:var(--mute);font-weight:600}.me td{color:#ffb070;font-weight:700}
.err{color:#ff8a70;min-height:20px;font-size:15px}.hint{color:var(--mute);font-size:14px;margin-top:10px}#hb{top:96px!important;left:auto!important;right:18px;pointer-events:auto;display:flex;gap:8px}
.mini{font:700 15px 'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;letter-spacing:.12em;color:var(--light);background:rgba(60,18,14,.85);border:1px solid #ff7a3d;padding:6px 14px;cursor:pointer}.mini:hover{filter:brightness(1.3)}

.btn.lock{opacity:.4;cursor:not-allowed;filter:grayscale(.7)}.btn.lock:hover{filter:grayscale(.7)}.btn.sel{box-shadow:inset 0 0 0 3px var(--light);filter:brightness(1.25)}
</style></head><body>
<div id="hud"><div id="hl"></div><div id="hc"><b id="tc">0</b><span>TILES</span><i id="tb"></i></div><div id="hr"></div><div id="hb"><button class="mini" tabindex="-1" onmousedown="event.preventDefault()" onclick="pauseGame()">PAUSE</button><button class="mini" tabindex="-1" onmousedown="event.preventDefault()" onclick="goHome()">HOME</button></div></div><div id="msg"></div><div id="menu"></div>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<script>if(typeof PokiSDK==="undefined"){window.PokiSDK={init:function(){return Promise.resolve()},gameLoadingFinished:function(){},gameplayStart:function(){},gameplayStop:function(){},commercialBreak:function(){return Promise.resolve()},rewardedBreak:function(){return Promise.resolve(false)},setDebug:function(){}}}</script>
<script src="mini3d.js"></script>
<script>
if(typeof THREE==="undefined"){document.getElementById("menu").style.display="flex";document.getElementById("menu").innerHTML="<h2>Graphics engine failed to load</h2><p>Please reload the page.</p>";throw new Error("no three")}
window.onerror=(m,s,l)=>{const e=document.getElementById("menu");e.style.display="flex";e.innerHTML="<h3>Error</h3><p>"+m+" (line "+l+")</p>"};
const T=THREE,$=i=>document.getElementById(i),MEM={},LS=(k,d)=>{let v=null;try{v=localStorage.getItem(k)}catch(e){}if(v==null)v=MEM[k];if(v==null)return d;try{return JSON.parse(v)}catch(e){return d}},lsSet=(k,v)=>{const x=typeof v=='string'?v:JSON.stringify(v);MEM[k]=x;try{localStorage.setItem(k,x)}catch(e){}},lsDel=k=>{delete MEM[k];try{localStorage.removeItem(k)}catch(e){}},esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NM=["Level 1 — The Treacherous Bridge","Level 2 — Iron Rain","Level 3 — Black Fog","Level 4 — The Final Trial"];
let DB=LS('bp_profiles',{});function saveDB(){lsSet('bp_profiles',DB)}
function hash(t){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
function withAd(cb){const done=()=>{AU.ad=false;applyVol();cb()};try{PokiSDK.commercialBreak(()=>{AU.ad=true;applyVol()}).then(done).catch(done)}catch(e){done()}}
let USER=LS('bp_user',null),UNL=1,BEST={},paused=false,inGame=false,cur=0,SB;
/* ---------- AUDIO ---------- */
const AU={ctx:null,set:Object.assign({master:70,music:50,sfx:80,mute:false},LS('bp_set',{}))};
function saveSet(){lsSet('bp_set',AU.set);applyVol()}
function applyVol(){if(!AU.ctx)return;const s=AU.set;AU.m.gain.value=(s.mute||AU.ad)?0:s.master/100;AU.mg.gain.value=s.music/100*.5;AU.sg.gain.value=s.sfx/100}
function audioInit(){if(AU.ctx){if(AU.ctx.state=='suspended')AU.ctx.resume();return}const c=AU.ctx=new(window.AudioContext||window.webkitAudioContext)();AU.m=c.createGain();AU.mg=c.createGain();AU.sg=c.createGain();AU.mg.connect(AU.m);AU.sg.connect(AU.m);AU.m.connect(c.destination);applyVol();
const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=300;f.connect(AU.mg);[55,55.4,82.4].forEach(fr=>{const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.value=fr;g.gain.value=.25;o.connect(g);g.connect(f);o.start()});
const l=c.createOscillator(),lg=c.createGain();l.frequency.value=.12;lg.gain.value=180;l.connect(lg);lg.connect(f.frequency);l.start();
setInterval(()=>{if(c.state!='running')return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='triangle';o.frequency.value=[220,261.6,196,174.6][Math.floor(Math.random()*4)];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(g);g.connect(AU.mg);o.start(t);o.stop(t+2.3)},2600)}
function tone(f1,f2,d,ty='sine',v=.3){if(!AU.ctx)return;const c=AU.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AU.sg);o.start(t);o.stop(t+d)}
function noise(d,v=.3){if(!AU.ctx)return;const c=AU.ctx,len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=c.createBufferSource(),g=c.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(AU.sg);s.start()}
const SFX={click:()=>tone(600,300,.08,'square',.1),jump:()=>tone(250,600,.15,'sine',.25),crack:()=>noise(.25,.3),slam:()=>noise(.2,.45),boom:()=>tone(90,30,.7,'sine',.5),die:()=>{tone(300,40,.6,'sawtooth',.3);noise(.4,.3)},win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,.25,'triangle',.3),i*130))};
document.addEventListener('click',e=>{audioInit();if(e.target.closest('button'))SFX.click()});
/* ---------- 3D ---------- */
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const S=new T.Scene(),C=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});
S.add(new T.HemisphereLight(0xffd0b0,0x200010,.8));const sun=new T.DirectionalLight(0xff8866,.6);sun.position.set(5,10,5);S.add(sun);const pl=new T.PointLight(0xffaa66,1.3,20);S.add(pl);
const lava=new T.Mesh(new T.PlaneGeometry(300,300),new T.MeshBasicMaterial({color:0xff4a10}));lava.rotation.x=-Math.PI/2;lava.position.y=-9;S.add(lava);
const pm=new T.Group();const body=new T.Mesh(new T.CylinderGeometry(.35,.35,.9,12),new T.MeshStandardMaterial({color:0x3fa7ff}));body.position.y=.45;
const head=new T.Mesh(new T.SphereGeometry(.3,12,12),new T.MeshStandardMaterial({color:0xffd9b3}));head.position.y=1.1;pm.add(body,head);S.add(pm);
const BOX=new T.BoxGeometry(1,1,1),SPH=new T.SphereGeometry(1,14,14);
const MT={solid:new T.MeshStandardMaterial({color:0x6b5a4c}),fake:new T.MeshStandardMaterial({color:0x6a584a}),blink:new T.MeshStandardMaterial({color:0x5b4f73}),pad:new T.MeshStandardMaterial({color:0x22cc66,emissive:0x0a5a2a})};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const keys={};addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;keys[e.code]=1;
if(e.code=='Space'&&grounded&&inGame&&!paused&&!dead){vy=9;grounded=false;SFX.jump()}
if(e.code=='Escape'){if(inGame&&!paused&&!dead){pauseGame()}else if(paused&&document.querySelector('#menu h2')?.textContent=='PAUSED')resume()}
if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=0);
let W,tiles,balls,crush,orbs,pad,tw,gr,twist,collapse,collapseRow,P=new T.Vector3(),vy=0,grounded=false,clock=0,mt=0,run=false,dead=false,lvl=1,lvDeaths=0,start0=0,rev=false,revShown=false,evT=6,fogB=0,lowg=0,shake=0,orbT=5,n=1;
function tile(x,z,ty,hx=1.1,hz=1.1,row=0,r=Math.random){const m=new T.Mesh(BOX,MT[ty]);m.scale.set(hx*2,.4,hz*2);m.position.set(x,-.2,z);W.add(m);const t={m,hx,hz,ty,row,ph:r()*3,fall:false,vy:0,ok:true,armed:0};tiles.push(t);return t}
function build(k){n=k;if(W)S.remove(W);W=new T.Group();S.add(W);tiles=[];balls=[];crush=[];orbs=[];const r=rng(k*1337),rows=[28,36,44,52][k-1];tw=k==4?3:2;gr=[rows+2,rows+8,rows+14].slice(0,tw);let safe=1;
for(let i=0;i<=gr[tw-1]+1;i++){safe=Math.max(0,Math.min(2,safe+Math.floor(r()*3)-1));if(gr.includes(i))continue;
for(let l=0;l<3;l++){let ty;if(i<2)ty='solid';else if(l==safe)ty=(k>=3&&r()<.35)?'blink':'solid';else{const q=r();ty=q<.45?null:q<.8?'fake':'blink'}
if(ty)tile((l-1)*2.4,-i*2.4,ty,1.1,1.1,i,r)}}
pad=tile(0,-gr[0]*2.4,'pad',3.5,2.2,0,r);pad.m.scale.y=.5;twist=0;collapse=false;collapseRow=0;
if(k>=2){for(let i=0;i<k*2+1;i++){const m=new T.Mesh(SPH,new T.MeshStandardMaterial({color:0x888899}));m.scale.setScalar(.8);W.add(m);balls.push({m,z:-(5+Math.floor(r()*(rows-6)))*2.4,sp:2.5+k+r()*2,ph:r()*6.28})}
for(let i=0;i<k*2;i++){const m=new T.Mesh(BOX,new T.MeshStandardMaterial({color:0x444444}));m.scale.set(2.3,1,2.3);W.add(m);crush.push({m,x:(Math.floor(r()*3)-1)*2.4,z:-(4+Math.floor(r()*(rows-5)))*2.4,per:2.5+r()*1.5,ph:r()*4,sl:0})}}
S.fog=new T.FogExp2(0x1a0608,[.02,.03,.075,.06][k-1]);S.background=new T.Color(0x1a0608)}
function reset(){build(lvl);P.set(0,0,0);vy=0;dead=false;rev=false;revShown=false;evT=6;fogB=0;lowg=0;orbT=5;cur=0;flash(NM[lvl-1])}
function flash(t,ms=1800){$('msg').textContent=t;clearTimeout(flash.h);flash.h=setTimeout(()=>$('msg').textContent='',ms)}
function post(a,o){if(!USER||a!='run'||!o.won||!DB[USER.name])return;const p=DB[USER.name],r=p.runs[o.level];if(!r||o.time<r.time)p.runs[o.level]={time:o.time,deaths:o.deaths};saveDB()}
function die(c){if(dead)return;dead=true;lvDeaths++;SFX.die();$('msg').textContent=c+' — you reached '+cur+' tiles';post('run',{level:lvl,tiles:cur,time:(performance.now()-start0)/1000,won:0,cause:c});PokiSDK.gameplayStop();setTimeout(()=>{if(inGame){reset();PokiSDK.gameplayStart()}},1500)}
/* ---------- SCREENS ---------- */
function show(h,title,hud){$('menu').innerHTML=(title?'<h1 class=title>BLIND PATH</h1><div class=sub>A HARDCORE 4-LEVEL SURVIVAL PLATFORMER</div>':'')+h;$('menu').style.display='flex';$('hud').style.display=hud?'block':'none'}
function hide(){$('menu').style.display='none';$('hud').style.display='block'}
function loadLocal(){const p=DB[USER.name];BEST=p.best||{};UNL=p.unl||1}
function saveLocal(){if(!USER||!DB[USER.name])return;const p=DB[USER.name];p.best=BEST;p.unl=UNL;saveDB()}
function findName(nm){return Object.keys(DB).find(k=>k.toLowerCase()==nm.toLowerCase())}
function signedIn(nm){USER={name:nm,age:DB[nm].age};lsSet('bp_user',USER);loadLocal();scrMain()}
function scrSignup(){show('<div class=panel><h2>CREATE ACCOUNT</h2><label>Player name</label><input type=text id=rn maxlength=20 placeholder="Enter your name"><label>Age</label><input type=number id=ra min=5 max=100 placeholder="Enter your age"><label>Password</label><input type=password id=rp placeholder="At least 4 characters" onkeydown="if(event.key==\'Enter\')doSignup()"><div class=err id=re></div><button class=btn onclick=doSignup()>SIGN UP</button><div class=hint>Already have an account? <button class=lnk onclick=scrLogin()>Login</button></div></div>',1)}
function doSignup(){const nm=$('rn').value.trim(),a=+$('ra').value,pw=$('rp').value;
if(nm.length<2){$('re').textContent='Name must be at least 2 characters.';return}if(!(a>=5&&a<=100)){$('re').textContent='Enter a valid age (5–100).';return}if(pw.length<4){$('re').textContent='Password must be at least 4 characters.';return}
if(findName(nm)){$('re').textContent='This name is already taken.';return}
DB[nm]={age:a,ph:hash(pw),unl:1,best:{},runs:{}};saveDB();signedIn(nm)}
function scrLogin(msg){show('<div class=panel><h2>LOGIN</h2><label>Player name</label><input type=text id=ln maxlength=20 placeholder="Enter your name"><label>Password</label><input type=password id=lp placeholder="Enter your password" onkeydown="if(event.key==\'Enter\')doLogin()"><div class=err id=le>'+(msg||'')+'</div><button class=btn onclick=doLogin()>LOGIN</button><div class=hint>New here? <button class=lnk onclick=scrSignup()>Create an account</button></div></div>',1)}
function doLogin(){const nm=$('ln').value.trim(),pw=$('lp').value;if(!nm||!pw){$('le').textContent='Enter your name and password.';return}
const k=findName(nm);if(!k||DB[k].ph!==hash(pw)){$('le').textContent='Wrong name or password.';return}signedIn(k)}
function scrMain(){inGame=false;run=false;paused=false;$('msg').textContent='';show('<div class=panel><div style="color:var(--mute)">Welcome, <b style="color:var(--light)">'+esc(USER.name)+'</b></div><button class=btn onclick=scrPlay()>PLAY</button><button class=btn onclick=scrBoard()>LEADERBOARD</button><button class=btn onclick="scrSettings(scrMain)">SETTINGS</button><div class=hint>WASD / Arrows: move · Space: jump · Esc: pause</div></div>',1)}
let SEL=null;
function scrPlay(){SEL=null;drawPlay()}
function pickLevel(i){SEL=i;drawPlay()}
function drawPlay(){let h='<div class=panel><h2>SELECT LEVEL</h2>';for(let i=1;i<=4;i++){const lk=i>UNL;h+='<button class="btn'+(lk?' lock':'')+(SEL==i?' sel':'')+'"'+(lk?' disabled':' onclick=pickLevel('+i+')')+'>LEVEL '+i+(lk?' — LOCKED':'')+'</button>'}
if(SEL)h+='<div class=hint>'+NM[SEL-1]+'</div><button class=btn style="margin-top:14px" onclick=startSel()>PLAY</button>';h+='<button class="btn sec" onclick=scrMain()>BACK</button></div>';show(h,1)}
function startSel(){lvl=SEL;go()}
function go(){PokiSDK.gameplayStop();withAd(()=>{lvDeaths=0;start0=performance.now();hide();run=true;inGame=true;paused=false;reset();PokiSDK.gameplayStart()})}
function slider(l,k){return'<div class=row><span>'+l+'</span><input type=range min=0 max=100 value='+AU.set[k]+' oninput="AU.set.'+k+'=+this.value;this.nextElementSibling.textContent=this.value;saveSet()"><b>'+AU.set[k]+'</b></div>'}
function scrSettings(back){SB=back;show('<div class=panel><h2>SETTINGS</h2>'+slider('Master Volume','master')+slider('Music','music')+slider('Sound Effects','sfx')+'<div class=row><span>Mute All</span><input type=checkbox '+(AU.set.mute?'checked':'')+' onchange="AU.set.mute=this.checked;saveSet()"></div><button class="btn sec" onclick=SB()>BACK</button><button class="btn sec" onclick=doLogout()>LOG OUT</button><div class=hint>Signed in as '+esc(USER.name)+'</div></div>',!inGame,inGame)}
function scrBoard(){let h='<div class=panel><h2>LEADERBOARD</h2>';for(let i=1;i<=4;i++)h+='<button class=btn onclick=scrBoardLevel('+i+')>LEVEL '+i+'</button>';h+='<button class="btn sec" onclick=scrMain()>BACK</button></div>';show(h,1)}
function scrBoardLevel(l){const d=Object.keys(DB).filter(k=>DB[k].runs&&DB[k].runs[l]).map(k=>({name:k,time_sec:DB[k].runs[l].time,deaths:DB[k].runs[l].deaths})).sort((x,y)=>x.time_sec-y.time_sec||x.deaths-y.deaths).slice(0,20);
show('<div class=panel style="width:min(560px,92vw)"><h2>LEVEL '+l+' — TOP TIMES</h2>'+(d.length?'<table><tr><th>#</th><th>Player</th><th>Time</th><th>Deaths</th></tr>'+d.map((x,i)=>'<tr'+(USER&&x.name==USER.name?' class=me>':'>')+'<td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+(+x.time_sec).toFixed(1)+' s</td><td>'+x.deaths+'</td></tr>').join('')+'</table>':'<p>Nobody has completed this level yet.</p>')+'<button class="btn sec" onclick=scrBoard()>BACK</button></div>',1)}
function pauseGame(){if(inGame&&!paused&&!dead){paused=true;PokiSDK.gameplayStop();scrPause()}}
function scrPause(){show('<div class=panel><h2>PAUSED</h2><button class=btn onclick=resume()>RESUME</button><button class="btn sec" onclick="scrSettings(scrPause)">SETTINGS</button><button class="btn sec" onclick=goHome()>HOME</button></div>',0,1)}
function resume(){hide();paused=false;PokiSDK.gameplayStart()}
function goHome(){PokiSDK.gameplayStop();inGame=false;run=false;paused=false;dead=false;$('msg').textContent='';build(1);scrMain()}
function doLogout(exp){PokiSDK.gameplayStop();lsDel('bp_user');USER=null;inGame=false;run=false;paused=false;dead=false;$('msg').textContent='';build(1);exp?scrLogin('Session expired. Please log in again.'):scrSignup()}
function win(){run=false;inGame=false;PokiSDK.gameplayStop();SFX.win();const t=(performance.now()-start0)/1000;post('run',{level:lvl,tiles:cur,time:t,deaths:lvDeaths,won:1});UNL=Math.max(UNL,Math.min(4,lvl+1));saveLocal();
const st='<p>Time: '+t.toFixed(1)+' s · Deaths: '+lvDeaths+'</p>';
if(lvl<4)show('<div class=panel><h2>LEVEL '+lvl+' COMPLETE</h2>'+st+'<button class=btn onclick="lvl++;go()">NEXT LEVEL</button><button class="btn sec" onclick=scrMain()>MAIN MENU</button></div>',0);
else show('<div class=panel><h2>YOU SURVIVED</h2>'+st+'<button class=btn onclick="lvl=1;go()">PLAY AGAIN</button><button class="btn sec" onclick=scrBoard()>LEADERBOARD</button><button class="btn sec" onclick=scrMain()>MAIN MENU</button></div>',0)}
/* ---------- GAME LOOP ---------- */
function step(dt){clock+=dt;const row=Math.floor(-P.z/2.4);
let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
if(n==4){rev=row>=18&&row<=26;if(rev&&!revShown){revShown=true;flash('Controls reversed!')}}
if(rev){dx=-dx;dz=-dz}P.x+=dx*6*dt;P.z+=dz*6*dt;
lowg=Math.max(0,lowg-dt);vy-=(lowg>0?10:26)*dt;P.y+=vy*dt;
let on=null;if(vy<=0)for(const t of tiles){if(!t.ok)continue;const p=t.m.position;if(Math.abs(P.x-p.x)<t.hx+.25&&Math.abs(P.z-p.z)<t.hz+.25&&P.y<=.15&&P.y>=-.6){on=t;break}}
if(on){P.y=0;vy=0;grounded=true;if(on.ty=='fake'&&!on.armed){on.armed=clock+.35;SFX.crack()}}else grounded=false;
const nt=Math.max(0,Math.round(-P.z/2.4));if(nt>cur){cur=nt;if(cur>(BEST[lvl]||0)){BEST[lvl]=cur;saveLocal()}}
for(const t of tiles){if(t.armed&&clock>t.armed)t.fall=true;
if(t.fall){t.vy+=20*dt;t.m.position.y-=t.vy*dt;t.m.rotation.z+=dt*.6;t.ok=t.m.position.y>-.6}
else if(t.ty=='blink'){const c=(clock+t.ph)%3.2;t.ok=c<2.4;t.m.visible=t.ok&&!(c>1.9&&Math.floor(c*14)%2)}}
if(twist<tw-1&&P.z<pad.m.position.z+7){twist++;pad.tz=-gr[twist]*2.4;flash('Wait… that goal was fake!');SFX.boom();if(!collapse){collapse=true;collapseRow=Math.max(0,row-5)}}
if(pad.tz!==undefined&&pad.m.position.z>pad.tz)pad.m.position.z=Math.max(pad.tz,pad.m.position.z-12*dt);
if(collapse){collapseRow+=dt*(1.5+n*.3);for(const t of tiles)if(t.ty!='pad'&&t.row<collapseRow)t.fall=true}
if(twist==tw-1&&on===pad&&pad.m.position.z<=(pad.tz??pad.m.position.z)+.05)return win();
for(const b of balls){const bx=5.5*Math.sin(clock*b.sp*.35+b.ph);b.m.position.set(bx,.8,b.z);b.m.rotation.z-=dt*b.sp;if(Math.hypot(bx-P.x,.8-(P.y+.8),b.z-P.z)<1.5)die('Crushed by an iron ball')}
for(const c of crush){const k=(clock+c.ph)%c.per;let y=7,col=0x444444,sl=false;if(k>c.per-1.3&&k<=c.per-.6)col=0xff2200;else if(k>c.per-.6&&k<=c.per-.3){y=.6;sl=true}else if(k>c.per-.3)y=3;c.m.material.color.setHex(col);c.m.position.set(c.x,y,c.z);
if(sl&&!c.sl&&Math.abs(c.z-P.z)<14)SFX.slam();c.sl=sl;if(sl&&Math.abs(P.x-c.x)<1.4&&Math.abs(P.z-c.z)<1.4&&P.y<1.5)die('A stone fell from above')}
orbT-=dt;if(n>=3&&orbT<=0&&orbs.length<n+1){orbT=7-n;const m=new T.Mesh(SPH,new T.MeshBasicMaterial({color:0xff2255}));m.scale.setScalar(.6);m.position.set(P.x,1.1,P.z-16);W.add(m);orbs.push({m,life:9})}
for(let i=orbs.length-1;i>=0;i--){const o=orbs[i],p=o.m.position,d=Math.hypot(P.x-p.x,P.z-p.z)||1,s=(3+n*.4)*dt;p.x+=(P.x-p.x)/d*s;p.z+=(P.z-p.z)/d*s;o.life-=dt;
if(Math.hypot(P.x-p.x,P.y+.9-p.y,P.z-p.z)<1.1)die('Caught by a red wraith');if(o.life<=0){W.remove(o.m);orbs.splice(i,1)}}
evT-=dt;if(evT<=0){evT=(n==1?8:5)+Math.random()*5;const e=Math.floor(Math.random()*(n==1?2:4));
if(e==0){fogB=1.4;flash('Darkness!',1200);SFX.boom()}else if(e==1){shake=.7;SFX.boom();flash('The ground is shaking!',1200);let c=0;for(const t of tiles)if(c<4&&t.ty!='pad'&&t.m.position.z<P.z-4&&t.m.position.z>P.z-12&&!t.fall&&Math.random()<.5){t.fall=true;c++}}
else if(e==2){lowg=3;flash('Gravity is failing!',1200)}else{orbT=0;orbs.length=Math.min(orbs.length,n)}}
fogB=Math.max(0,fogB-dt);S.fog.density=[.02,.03,.075,.06][n-1]+(fogB>0?.35:0);
if(P.y<-10)die('You fell');
pm.position.copy(P);pl.position.set(P.x,P.y+3,P.z);lava.position.z=P.z;lava.material.color.setHSL(.04+.01*Math.sin(clock*3),1,.5);
shake=Math.max(0,shake-dt);C.position.lerp(new T.Vector3(P.x*.6,P.y*.5+4.6,P.z+7.5),.12);C.position.x+=(Math.random()-.5)*shake*.4;C.lookAt(P.x*.6,1,P.z-4);
$('hl').textContent=NM[n-1];$('tc').textContent=cur;$('tb').textContent='BEST '+(BEST[lvl]||0);$('hr').innerHTML='Deaths: '+lvDeaths+'<br>Time: '+((performance.now()-start0)/1000).toFixed(0)+' s<br><span style="font-size:13px;color:var(--mute)">Esc — pause</span>'}
let last=performance.now();(function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
if(run&&!paused&&!dead)step(dt);
if(!inGame){mt+=dt;C.position.set(Math.sin(mt*.15)*9,5+Math.sin(mt*.2),-30+Math.cos(mt*.15)*9);C.lookAt(0,0,-30);pm.position.set(0,0,0);lava.position.z=-30}
R.render(S,C)})(last);
if(USER&&!DB[USER.name])USER=null;build(1);if(USER){loadLocal();scrMain()}else scrSignup();
addEventListener('blur',pauseGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
PokiSDK.init().then(()=>PokiSDK.gameLoadingFinished()).catch(()=>{});
</script></body></html>
